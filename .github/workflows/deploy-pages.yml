name: Publicar dashboard no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Gerar build
        working-directory: frontend
        run: npm run build

      - name: Montar site sem substituir o estudo
        shell: bash
        run: |
          rm -rf site
          mkdir -p site/study
          cp -R docs/. site/study/
          cp output/metamorfose-do-poder-2004-2024.pdf site/study/
          cp -R frontend/dist/. site/

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Fazer upload do artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Publicar
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
